<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" fill="none">
  <defs>
    <linearGradient id="logoArmGrad" x1="60" y1="48" x2="300" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="52%" stop-color="#1EA8FF" />
      <stop offset="100%" stop-color="#397BFF" />
    </linearGradient>
    <linearGradient id="logoLeftHighlight" x1="64" y1="54" x2="180" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8AF0FF" stop-opacity="0.72" />

      <stop offset="100%" stop-color="#397BFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Symbol (Left) -->
  <circle cx="182" cy="176" r="154" fill="url(#logoAmbientHalo)" />

  <g transform="translate(26, 20) scale(0.61)">

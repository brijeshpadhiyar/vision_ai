    <circle cx="256" cy="202" r="35" stroke="#00D4FF" stroke-opacity="0.55" stroke-width="2.75" />
    <circle cx="256" cy="202" r="26" fill="url(#logoIrisGlow)" />
    <circle cx="256" cy="202" r="11.5" fill="#080D18" />
    <circle cx="262.5" cy="194.5" r="4.6" fill="#FFFFFF" />

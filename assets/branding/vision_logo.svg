    <linearGradient id="logoEyeRim" x1="108" y1="126" x2="256" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#8AF0FF" />

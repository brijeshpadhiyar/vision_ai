      <stop offset="60%" stop-color="#397BFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#397BFF" stop-opacity="0.0" />
    </radialGradient>
    <linearGradient id="logoDividerGrad" x1="346" y1="84" x2="346" y2="276" gradientUnits="userSpaceOnUse">

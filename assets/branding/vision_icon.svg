<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="visionArmGrad" x1="96" y1="96" x2="416" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="52%" stop-color="#1EA8FF" />
      <stop offset="100%" stop-color="#397BFF" />
    </linearGradient>
    <linearGradient id="visionLeftHighlight" x1="104" y1="108" x2="256" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8AF0FF" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="visionEyeRim" x1="156" y1="196" x2="356" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#8AF0FF" />
      <stop offset="100%" stop-color="#397BFF" />
    </linearGradient>
    <radialGradient id="visionIrisGlow" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#E6FCFF" />
      <stop offset="30%" stop-color="#00D4FF" />
      <stop offset="74%" stop-color="#397BFF" />
      <stop offset="100%" stop-color="#163E9E" />
    </radialGradient>
    <radialGradient id="visionAmbientHalo" cx="50%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#397BFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#397BFF" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Subtle atmospheric AI aura -->
  <circle cx="256" cy="240" r="206" fill="url(#visionAmbientHalo)" />

  <!-- Outer stylized geometric V frame -->
  <path
    d="M 88 112 L 154 112 L 256 364 L 358 112 L 424 112 L 284 432 C 276 448, 236 448, 228 432 Z"
    fill="url(#visionArmGrad)"
  />

  <!-- Inner beveled facet on left wing for dimensional precision -->
  <path
    d="M 88 112 L 116 112 L 244 416 L 228 432 Z"
    fill="url(#visionLeftHighlight)"
  />

  <!-- Dark optical cradle behind the AI eye for crisp contrast on light and dark surfaces -->
  <path
    d="M 152 202 C 194 142, 318 142, 360 202 C 318 262, 194 262, 152 202 Z"
    fill="#080D18"
  />

  <!-- Precision eye aperture contour -->
  <path
    d="M 158 202 C 197 147, 315 147, 354 202 C 315 257, 197 257, 158 202 Z"
    stroke="url(#visionEyeRim)"
    stroke-width="7.5"
    stroke-linejoin="round"
    fill="#101A2B"
  />

  <!-- Outer AI telemetry ring nested cleanly inside the optical aperture -->
  <circle
    cx="256"
    cy="202"
    r="35"
    stroke="#00D4FF"
    stroke-opacity="0.55"
    stroke-width="2.75"
  />

  <!-- Luminous AI iris -->
  <circle cx="256" cy="202" r="26" fill="url(#visionIrisGlow)" />

  <!-- Deep obsidian pupil core -->
  <circle cx="256" cy="202" r="11.5" fill="#080D18" />

  <!-- Specular awareness highlight -->
  <circle cx="262.5" cy="194.5" r="4.6" fill="#FFFFFF" />
  <circle cx="247.5" cy="209.5" r="1.9" fill="#8AF0FF" fill-opacity="0.85" />

  <!-- Precision apex anchor -->
  <polygon points="256,374 268,396 256,418 244,396" fill="#080D18" fill-opacity="0.55" />
</svg>
